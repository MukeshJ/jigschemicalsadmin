<div class="page-header-main">
    <div class="row align-items-center justify-content-between">
        <div class="col-md-auto col-sm-auto col">
            <div class="content-header">
                <h1>{{'INDUSTRIES' | translate}}</h1>
            </div>
        </div>
        <div class="col-md-auto col-sm-auto col-auto">
            <button *hasClaim="'industry_add_industry'" class="btn blue-btn btn-sm m-right-10"
                [routerLink]="['/industry/manage/addItem']">
                <i class="fas fa-plus"></i> {{'ADD_INDUSTRY' | translate}}
            </button>
        </div>
    </div>
</div>

<div class="table-responsive">
    <table mat-table [dataSource]="dataSource" matSort class="table table-bordered table-hover">
        <ng-container matColumnDef="action">
            <th class="table-column-150" mat-header-cell *matHeaderCellDef mat-sort-header> {{'ACTION' | translate}} </th>
            <td class="table-column-150" mat-cell *matCellDef="let industry">
                <button *hasClaim="'industry_update_industry'" [routerLink]="['/industry/manage',industry.id]"
                    class="btn btn-success btn-sm m-right-10" type="button">
                    <i class="fas fa-pencil-alt"></i>
                    <span class="d-none d-sm-inline"> {{'EDIT' | translate}}</span>
                </button>
                <button *hasClaim="'industry_delete_industry'" (click)="deleteIndustry(industry)"
                    class="btn btn-danger btn-sm" type="button">
                    <i class="fas fa-trash-alt"></i>
                    <span class="d-none d-sm-inline"> {{'DELETE' | translate}}</span>
                </button>
            </td>
        </ng-container>
        <ng-container  matColumnDef="name">
            <th class="table-column-300" mat-header-cell *matHeaderCellDef mat-sort-header> {{'NAME' | translate}} </th>
            <td class="table-column-300" mat-cell *matCellDef="let industry"> {{industry.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th class="table-column-500" mat-header-cell *matHeaderCellDef mat-sort-header> {{'DESCRIPTION' | translate}} </th>
            <td class="table-column-500" mat-cell *matCellDef="let industry"> {{industry.shortDescription | limitTo: 80}} </td>
        </ng-container>

        <ng-container matColumnDef="footer">
            <td mat-footer-cell colspan="3" *matFooterCellDef>
                <mat-paginator [pageSizeOptions]="[15,20,30]"></mat-paginator>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr mat-footer-row *matFooterRowDef="footerToDisplayed;sticky: true"></tr>
    </table>
</div>
