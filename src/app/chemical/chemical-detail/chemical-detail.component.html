<div class="page-header-main">
  <div class="row align-items-center justify-content-between">
    <div class="col-md-auto col-sm-auto">
      <div class="content-header">
        <h1>{{'MANAGE_CHEMICAL' | translate}}</h1>
      </div>
    </div>
  </div>
</div>
<form autocomplete="off" [formGroup]="chemicalForm" (ngSubmit)="onChemicalSave()">
  <div class="row">
    <div class="col-md-6 col-sm-12">
      <div class="form-group">
        <label class="text-danger">{{'NAME' | translate}} *</label>
        <input formControlName="name" class="form-control w-100" type="text">
        <div *ngIf="chemicalForm.get('name').touched && chemicalForm.get('name').errors">
          <div class="text-danger" *ngIf="chemicalForm.get('name').errors?.required">
            {{'CHEMICAL_NAME_IS_REQUIRED' | translate}}
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-sm-12">
      <div class="form-group">
        <label>Select Unit </label>
        <mat-select placeholder="Select Unit" class="w-100 form-control" formControlName="unitId">
          <mat-option *ngFor="let unit of units" [value]="unit.id">
            {{unit.name}}
          </mat-option>
        </mat-select>
        <div *ngIf="chemicalForm.get('unitId').touched && chemicalForm.get('unitId').errors">
          <div class="text-danger" *ngIf="chemicalForm.get('unitId').errors?.required">
            Unit is required.
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-3 col-sm-12">

      <div class="row">
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <mat-label>{{'CHEMICAL_TYPE' | translate}}</mat-label>
            <mat-select placeholder="{{'SELECT_CHEMICAL_TYPE' | translate}}" class="w-100 form-control"
              formControlName="chemicalCategories" multiple>
              <mat-option *ngFor="let category of categories" [value]="category.id">{{category.name}}
              </mat-option>
            </mat-select>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 col-sm-12">
      <div class="form-group">
        <label>{{'CAS_NUMBER' | translate}}</label>
        <input formControlName="casNumber" class="form-control w-100" type="text">
      </div>
    </div>
    <div class="col-md-4 col-sm-12">
      <div class="form-group">
        <label>{{'H_BOND_ACCEPTOR' | translate}}</label>
        <input formControlName="hBondAcceptor" class="form-control w-100" type="text">
      </div>
    </div>
    <div class="col-md-4 col-sm-12">
      <div class="form-group">
        <label>{{'H_BOND_DONOR' | translate}}</label>
        <input formControlName="hBondDonor" class="form-control w-100" type="text">
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8 col-12">
      <div class="row">
        <div class="col-md-12 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-6">
              <div class="form-group">
                <label>{{'IUPAC_NAME' | translate}}</label>
                <input formControlName="iUPACName" class="form-control w-100" type="text">
              </div>
            </div>
            <div class="col-md-6 col-sm-6">
              <div class="form-group">
                <label>Is Show In Frontend</label>
                <input formControlName="isShowInFront" class="form-control" type="checkbox">
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <label>{{'InChIKey' | translate}}</label>
            <input formControlName="inChIKey" class="form-control w-100" type="text">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <label>{{'MOLECULAR_WEIGHT' | translate}}</label>
            <input formControlName="molecularWeight" class="form-control w-100" type="text">
          </div>
        </div>
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <label>{{'MOLECULAR_FORMULA' | translate}}</label>
            <input placeholder="C<sub>8</sub>H<sub>7</sub>ClN<sub>2</sub>OS" formControlName="molecularFormula"
              class="form-control w-100" type="text">
            <div *ngIf="chemicalForm.get('molecularFormula').value"
              [innerHTML]="chemicalForm.get('molecularFormula').value"></div>
            <div *ngIf="!chemicalForm.get('molecularFormula').value"
              [innerHTML]="'e.g.  C<sub>8</sub>H<sub>7</sub>ClN<sub>2</sub>OS'"></div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <label>{{'SYNONYMS' | translate}}</label>
            <input formControlName="synonyms" class="form-control w-100" type="text">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 col-sm-12">
          <div class="form-group">
            <mat-label>{{'CHEMICAL_INDUSTRIES' | translate}}</mat-label>
            <mat-select placeholder="{{'SELECT_CHEMICAL_INDUSTRY' | translate}}" class="w-100 form-control"
              formControlName="chemicalIndustries" multiple>
              <mat-option *ngFor="let industry of industries" [value]="industry.id">{{industry.name}}
              </mat-option>
            </mat-select>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4 col-12">
      <div class="row">
        <div class="col-md-12 col-md-3">
          <mat-card class="cus-mat-card text-center">
            <input hidden (change)="onFileSelect($event)" #fileInput name="logo" type="file" name="Profile Photo"
              fxFlex="30">
            <img *ngIf="imgSrc" class="full-width" [src]="imgSrc" />
            <img *ngIf="!imgSrc" class="full-width" src="../../../assets/images/chemical-image.jpg" />
            <mat-card-actions>
              <button type="button" *ngIf="!imgSrc" class="btn btn-success btn-sm m-right-10"
                (click)="fileInput.click()">
                <i class="far fa-image"></i> {{'ADD_IMAGE' | translate}}</button>
              <button type="button" *ngIf="imgSrc" class="btn btn-success btn-sm m-right-10"
                (click)="fileInput.click()">
                <i class="far fa-image"></i> {{'CHANGE_IMAGE' | translate}}</button>
              <button *ngIf="imgSrc" type="button" (click)="onRemoveImage()" class="btn btn-danger btn-sm">
                <i class="fas fa-trash-alt"></i> {{'REMOVE_IMAGE' | translate}}</button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 mt-2">
      <button type="submit" class="btn btn-success btn-sm m-right-10"><i class="fas fa-save"></i> {{'SAVE' |
        translate}}</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="onChemicalList()">
        <i class="fas fa-times-circle"></i>
        {{'CANCEL' | translate}}
      </button>
    </div>
  </div>
</form>
