<div class="modal-content1">
  <div class="modal-header">
    <div class="d-flex w-100 align-items-center justify-content-between">
      <div class="col-md-8">
        <h4 class="modal-title">{{ 'CUSTOMERS_FOR' | translate }} : {{ data.name }}</h4>
      </div>
      <div class="col-sm-auto ml-auto">
        <button
          *hasClaim="'chemical_assign_chemical_to_customer'"
          (click)="addChemicalCustomer()"
          type="button"
          class="btn blue-btn btn-sm mt-0"
        >
          <i class="fas fa-plus"></i> {{ 'ADD_CUSTOMER' | translate }}
        </button>
        <button type="button" class="close" (click)="closeDialog()" data-dismiss="modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-body">
    <div class="table-responsive">
      <table
        mat-table
        [dataSource]="customers"
        class="table table-bordered table-hover dialog-grid-height"
      >
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>{{ 'NAME' | translate }}</th>
          <td mat-cell *matCellDef="let customer">{{ customer.customerName }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>{{ 'EMAIL' | translate }}</th>
          <td mat-cell *matCellDef="let customer">{{ customer.email }}</td>
        </ng-container>
        <ng-container matColumnDef="mobile">
          <th mat-header-cell *matHeaderCellDef>{{ 'MOBILE' | translate }}</th>
          <td mat-cell *matCellDef="let customer">{{ customer.mobileNo }}</td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>{{ 'ACTION' | translate }}</th>
          <td mat-cell *matCellDef="let customer">
            <button
              *hasClaim="'chemical_assign_chemical_to_customer'"
              (click)="removeCustomerFromChemial(customer)"
              class="btn btn-danger btn-sm"
              type="button"
            >
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </ng-container>
        <ng-container matColumnDef="name-search">
          <th class="pr-5" mat-header-cell *matHeaderCellDef>
            <input type="text" class="form-control w-90" [(ngModel)]="NameFilter" />
          </th>
        </ng-container>
        <ng-container matColumnDef="email-search">
          <th class="pr-5" mat-header-cell *matHeaderCellDef>
            <input type="text" class="form-control w-90" [(ngModel)]="EmailFilter" />
          </th>
        </ng-container>
        <ng-container matColumnDef="mobile-search">
          <th class="pr-5" mat-header-cell *matHeaderCellDef>
            <input type="text" class="form-control w-90" [(ngModel)]="MobileFilter" />
          </th>
        </ng-container>
        <ng-container matColumnDef="remove-supplier-search">
          <th mat-header-cell *matHeaderCellDef></th>
        </ng-container>
        <ng-container matColumnDef="footer">
          <td mat-footer-cell colspan="5" *matFooterCellDef>
            <mat-paginator
              #paginator
              [length]="totalCustomers"
              (page)="pageChange($event)"
              [pageSize]="10"
            >
            </mat-paginator>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr
          mat-header-row
          *matHeaderRowDef="
            ['name-search', 'email-search', 'mobile-search', 'remove-supplier-search'];
            sticky: true
          "
          class="example-second-header-row"
        ></tr>
        <tr mat-footer-row *matFooterRowDef="columnsToDisplay; sticky: true"></tr>
      </table>
      @if (customers.length === 0) {
        <div class="row">
          <div class="col-sm-12 ml-4 mt-3">
            <label class="font-weight-bold"> {{ 'NO_DATA_FOUND' | translate }}</label>
          </div>
        </div>
      }
    </div>
  </div>
</div>
