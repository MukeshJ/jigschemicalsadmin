<div class="modal-content1">
  <div class="modal-header">
    <div class="d-flex w-100 align-items-center justify-content-between">
      <div class="col-md-8">
        <h4 class="modal-title">
          {{ 'CHEMICALS_LIST' | translate }}
        </h4>
      </div>
      <div class="col-sm-auto ml-auto">
        <button type="button" class="close" (click)="closeDialog()" data-dismiss="modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-body">
    <div class="table-container table-container dialog-grid-height">
      <table mat-table [dataSource]="chemicals()" class="mat-elevation-z8 table">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th style="width: 50%" mat-header-cell *matHeaderCellDef>{{ 'NAME' | translate }}</th>
          <td mat-cell *matCellDef="let chemical">{{ chemical.name | limitTo: 45 }}</td>
        </ng-container>

        <ng-container style="width: 30%" matColumnDef="casNumber">
          <th mat-header-cell *matHeaderCellDef>{{ 'CAS_NUMBER' | translate }}</th>
          <td mat-cell *matCellDef="let chemical">{{ chemical.casNumber }}</td>
        </ng-container>
        <ng-container matColumnDef="totalSupplier">
          <th style="width: 20%" mat-header-cell *matHeaderCellDef>
            {{ 'TOTAL_SUPPLIER' | translate }}
          </th>
          <td mat-cell *matCellDef="let chemical">
            <a (click)="viewSuppliers(chemical)" class="btn blue-btn btn-sm"
              >{{ 'SUPPLIERS' | translate }} ({{ chemical.supplierCount }})
            </a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
