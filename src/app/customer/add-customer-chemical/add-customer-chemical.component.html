<div class="modal-content1">
  <div class="modal-header">
    <div class="d-flex w-100 align-items-center justify-content-between">
      <div class="col-md-10">
        <h4 class="modal-title">
          {{'ADD_CHEMICAL_FOR' | translate}} <strong> {{data.customerName}}</strong>
        </h4>
      </div>
      <div class="col-sm-auto ml-auto">
        <button type="button" class="close" (click)="closeDialog()" data-dismiss="modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-body" [formGroup]="customerChemicalForm">
    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <div class="form-group">
          <input class="form-control" placeholder="{{'SEARCH_CHEMICALS' | translate}}" [matAutocomplete]="autoForChemical"
            formControlName="chemicalName" />
          <mat-autocomplete #autoForChemical="matAutocomplete">
            <mat-option (click)="selectChemical(chemical)" *ngFor="let chemical of chemicals$ | async"
              [value]="chemical.name">
              <span>{{ chemical.name }}</span>
            </mat-option>
          </mat-autocomplete>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <button (click)="saveCustomerChemicals()" type="button" class="btn btn-success btn-sm mt-2">
          <i class="fas fa-plus"></i> {{'ADD' | translate}}
        </button>
      </div>
    </div>
  </div>
</div>
