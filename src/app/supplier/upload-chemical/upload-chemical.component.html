<div class="page-header-main">
    <div class="row align-items-center justify-content-between">
        <div class="col-md-auto col-sm-auto col">
            <div class="content-header">
                <h1> Map Chemicals to Supplier </h1>
            </div>
        </div>
        <div class="col-md-auto col-sm-auto col-auto">
            <a class="btn blue-btn btn-sm m-right-10" href="../../../assets/csv/Chemicals.xlsx">
                <i class="fas fa-download"></i> Donload Sample File
            </a>
        </div>
    </div>
    <br>
    <div class="row" [formGroup]="supplierChemicalForm">
        <div class="col-md-12 mb-3">
            <input class="form-control" placeholder="{{'SEARCH_SUPPLIER' | translate}}"
                [matAutocomplete]="autoForSupplier" formControlName="supplierNameInput" />
            <mat-autocomplete #autoForSupplier="matAutocomplete">
                <mat-option (click)="selectSupplier(supplier)" *ngFor="let supplier of suppliers$ | async"
                    [value]="supplier.supplierName">
                    <span>{{ supplier.supplierName }}</span>
                </mat-option>
            </mat-autocomplete>
        </div>
        <div class="col-md-7 col-sm-12">
            <div class="col-sm-5 col-md-6"> <label>Chemical Upload</label>
                <input class="form-control" #file (change)="onFileSelected($event)" type="file">
            </div>
            <div class="col-sm-5  col-md-6  mt-4 mb-4">
                <button type="submit" (click)="upload()" class="btn btn-success btn-sm m-right-10">
                    <i class="fas fa-save"></i>
                    Upload Excel</button>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <table class="table table-bordered table-hover" *ngIf="response">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Records</th>
                        <th scope="col">Count</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td scope="row">1</td>
                        <td>Success Records</td>
                        <td>{{response?.successRecords.length}}</td>
                        <td>
                            <div class="text-danger" *ngIf="response?.successRecords.length > 0">
                                <button type="submit" (click)="onDownloadReport('successRecords')"
                                    class="btn btn-success btn-sm m-right-10"><i class="fas fa-save"></i>
                                    Export To Excel</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td scope="row">2</td>
                        <td>Skiped Records</td>
                        <td>{{response?.skipedRecords.length}}</td>
                        <td>
                            <div class="text-danger" *ngIf="response?.skipedRecords.length > 0">
                                <button type="submit" (click)="onDownloadReport('skipedRecords')"
                                    class="btn btn-success btn-sm m-right-10"><i class="fas fa-save"></i>
                                    Export To Excel</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td scope="row">3</td>
                        <td>Faild Records</td>
                        <td>{{response?.failedRecords.length}}</td>
                        <td>
                            <div class="text-danger" *ngIf="response?.failedRecords.length > 0">
                                <button type="submit" (click)="onDownloadReport('failedRecords')"
                                    class="btn btn-success btn-sm m-right-10"><i class="fas fa-save"></i>
                                    Export To Excel</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
