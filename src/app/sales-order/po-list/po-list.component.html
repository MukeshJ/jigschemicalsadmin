<div class="page-header-main">
  <div class="row align-items-center">
    <div class="col-md-auto col-sm-auto">
      <div class="content-header">
        <h1>{{'PURCHASE_ORDERS' | translate}}</h1>
      </div>
    </div>
  </div>
</div>
<div class="loading-shade" *ngIf="isLoading">
  <mat-spinner></mat-spinner>
</div>

<div class="table-responsive">
  <table mat-table [dataSource]="purchaseOrderList" class="table table-bordered table-hover">
    <ng-container matColumnDef="purchaseOrderName">
      <th mat-header-cell *matHeaderCellDef>{{'PO_NUMBER' | translate}}#</th>
      <td mat-cell *matCellDef="let element">
        {{element.purchaseOrderName}}
      </td>
    </ng-container>
    <ng-container matColumnDef="supplierName">
      <th mat-header-cell *matHeaderCellDef> {{'SUPPLIER_NAME' | translate}} </th>
      <td mat-cell *matCellDef="let element">
        <a style="cursor: pointer;" class="link-primary" (click)="onSupplierRedirect(element)">{{element.supplierName}}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> {{'QUANTITY' | translate}} </th>
      <td mat-cell *matCellDef="let element">
        {{element.quantity}}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
