<div class="page-header-main mt-2">
  <div class="row align-items-center justify-content-between">
    <div class="col-md-auto col-sm-auto">
      <div class="content-header">
        <h1>{{ 'SALES_VS_PURCHASE_REPORT' | translate }}</h1>
      </div>
    </div>
    <div class="col-md-auto col-sm-auto">
      <div class="d-flex align-items-center flex-wrap gap-3">
        <div class="d-flex align-items-center">
          <label class="me-2 mb-0 font-weight-bold"> {{ 'MONTH' | translate }}:</label>
          <select (change)="getReportData()" [(ngModel)]="selectedMonth" class="form-control">
            @for (month of months; track month) {
              <option [value]="month.id">
                {{ month.name }}
              </option>
            }
          </select>          
        </div>
        <div class="d-flex align-items-center">
          <label class="me-2 mb-0 font-weight-bold"> {{ 'YEAR' | translate }}:</label>
          <select (change)="getReportData()" [(ngModel)]="selectedYear" class="form-control">
            @for (year of years; track year) {
              <option [value]="year">
                {{ year }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
<div style="position: relative; height: 400px">
  <canvas
    baseChart
    [data]="barChartData()"
    [options]="barChartOptions"
    [legend]="true"
    [type]="barChartType"
  >
  </canvas>
</div>
