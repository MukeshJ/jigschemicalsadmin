<div class="page-header-main">
  <div class="row align-items-center justify-content-between">
    <div class="col-md-auto col-sm-auto">
      <div class="content-header">
        <h1>{{ 'MANAGE_ROLE' | translate }}</h1>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="form-group col-md-6">
    <label>{{ 'ROLE_NAME' | translate }}</label>
    <input [(ngModel)]="role.name" type="text" class="form-control" />
  </div>
</div>
<div class="row align-items-center">
  <div class="col-sm-12">
    <h4 class="widget-title">{{ 'PERMISSION' | translate }}</h4>
    <mat-checkbox color="primary" (change)="selecetAll($event)" class="example-margin"
      >Select All</mat-checkbox
    >
  </div>
</div>
<div class="row">
  <div class="col-sm-12">
    @for (page of pages; track page; let i = $index) {
      <div fxLayout="row wrap">
        <div fxFlex="100" fxFlex.sm="100">
          <mat-checkbox color="primary" (change)="onPageSelect($event, page.name)">
            <b> {{ page.name }}</b>
          </mat-checkbox>
        </div>
        <div class="row ml-2">
          @for (action of actions; track action) {
            @if (checkPageAction(page.id, action.id)) {
              <div class="col-sm-3">
                <mat-checkbox
                  color="primary"
                  [checked]="checkPermission(page.id, action.id)"
                  (change)="onPermissionChange($event, page, action)"
                >
                  {{ action.name }}
                </mat-checkbox>
              </div>
            }
          }
        </div>
      </div>
    }
  </div>
</div>
<div class="row">
  <div class="col-sm-12 mt-2">
    <button class="btn btn-success btn-sm m-right-10" (click)="saveRole()" cdkFocusInitial>
      <i class="fas fa-save"></i> {{ 'SAVE' | translate }}
    </button>
    <button class="btn btn-danger btn-sm" [routerLink]="['/roles']">
      <i class="fas fa-times-circle"></i> {{ 'CANCEL' | translate }}
    </button>
  </div>
</div>
