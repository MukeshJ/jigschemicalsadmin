<div class="page-header-main">
  <div class="row align-items-center justify-content-between">
    <div class="col-md-auto col-sm-auto">
      <div class="content-header">
        <h1>{{ 'CHEMICALTYPES' | translate }}</h1>
      </div>
    </div>
    <div class="col-md-auto col-sm-auto">
      <button class="btn blue-btn btn-sm m-right-10" (click)="manageChemicalType($any({}))">
        <i class="fas fa-plus"></i>
        {{ 'ADD_CHEMICALTYPE' | translate }}
      </button>
    </div>
  </div>
</div>
<div class="table-responsive">
  @if (chemicalTypes$ | async; as chemicalTypes) {
    <table
      mat-table
      [dataSource]="chemicalTypes"
      class="table table-bordered table-hover grid-height"
    >
      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th class="table-column-200" mat-header-cell *matHeaderCellDef>
          {{ 'ACTION' | translate }}
        </th>
        <td class="table-column-200" mat-cell *matCellDef="let element">
          <button
            (click)="manageChemicalType(element)"
            class="btn btn-success btn-sm m-right-10"
            type="button"
          >
            <i class="fas fa-pencil-alt"></i>
            <span class="d-none d-sm-inline"> {{ 'EDIT' | translate }}</span>
          </button>
          <button (click)="deleteChemicalType(element)" class="btn btn-danger btn-sm" type="button">
            <i class="fas fa-trash-alt"></i>
            <span class="d-none d-sm-inline"> {{ 'DELETE' | translate }}</span>
          </button>
        </td>
      </ng-container>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ 'NAME' | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>
      <ng-container matColumnDef="isShowFront">
        <th mat-header-cell *matHeaderCellDef>Is Show Frontend</th>
        <td mat-cell *matCellDef="let element">
          <mat-slide-toggle
            class="example-margin"
            [checked]="element.isShowFront"
            [disabled]="'true'"
          >
          </mat-slide-toggle>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
